events {
    worker_connections 1024;
}

http {
    # Map for API Keys validity
    map $http_x_api_key $api_key_valid {
        default 0;
        "challenge-key" 1;
        "leandro-key" 1;
    }

    # Map for Control Plane (Pipeline) Key
    map $http_x_control_key $control_key_valid {
        default 0;
        "super-secret-key" 1;
    }

    # Map for Basic Tier Limit (1 req/sec)
    map $http_x_api_key $limit_key_basic {
        "challenge-key" $http_x_api_key;
        default "";
    }

    # Map for Pro Tier Limit (5 req/sec)
    map $http_x_api_key $limit_key_pro {
        "leandro-key" $http_x_api_key;
        default "";
    }

    # Rate limits per API Key
    limit_req_zone $limit_key_basic zone=basic_limit:10m rate=1r/s;
    limit_req_zone $limit_key_pro zone=pro_limit:10m rate=5r/s;
    limit_req_zone $control_key_valid zone=control_limit:10m rate=1r/m;

    # Custom log format for Loki to parse JSON
    log_format json_combined escape=json
    '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"api_key_valid":"$api_key_valid"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log notice;

    server {
        listen 80;
        server_name localhost;

        location / {
            # Check API Key
            if ($api_key_valid = 0) {
                return 401 '{"error": "Unauthorized. Invalid or missing X-API-Key header."}';
            }

            # Apply Rate Limits (Nginx ignores empty keys)
            limit_req zone=basic_limit burst=10 nodelay;
            limit_req zone=pro_limit burst=40 nodelay;

            # Proxy to the inference API
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Control Plane: Webhook for n8n Pipeline
        location /webhook/ {
            if ($control_key_valid = 0) {
                return 403 '{"error": "Forbidden. Invalid or missing X-Control-Key."}';
            }

            # Apply Rate Limit (1r/m)
            limit_req zone=control_limit burst=1 nodelay;

            # Proxy to n8n (internal)
            proxy_pass http://n8n:5678/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-running pipeline tasks
            proxy_read_timeout 6000s;
            proxy_connect_timeout 6000s;
        }

        # Error page for rate limit
        error_page 503 @ratelimit;
        location @ratelimit {
            default_type application/json;
            return 503 '{"error": "Service Unavailable. Rate limit exceeded."}';
        }
    }
}
