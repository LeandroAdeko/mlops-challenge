services:
  prepare_dataset:
    profiles: ["prepare"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-challenge-ml:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - tfds_cache:/tfds
    environment:
      TFDS_DATA_DIR: /tfds
      WRAPT_DISABLE_EXTENSIONS: "1"
      PYTHONUNBUFFERED: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: "-1"
    command: >
      bash -lc "python -m ml.prepare_dataset
      --output_dir ${OUTPUT_DIR:-data/processed}
      --dataset_name ${DATASET_NAME:-para_crawl/enpt}
      --max_tokens ${MAX_TOKENS:-64}
      --train_records ${TRAIN_RECORDS:-20000}
      --val_records ${VAL_RECORDS:-2000}
      --seed ${SEED:-42}"

  train:
    profiles: ["train"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-challenge-ml:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - tfds_cache:/tfds
    environment:
      TFDS_DATA_DIR: /tfds
      WRAPT_DISABLE_EXTENSIONS: "1"
      PYTHONUNBUFFERED: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: "-1"
    command: >
      bash -lc "python -m ml.train
      --data_dir ${OUTPUT_DIR:-data/processed}
      --artifacts_dir ${ARTIFACTS_DIR:-artifacts}
      --epochs ${EPOCHS:-5}
      --batch_size ${BATCH_SIZE:-32}
      --threshold ${THRESHOLD:-0.30}
      --max_tokens ${MAX_TOKENS:-64}
      --git_sha ${GIT_SHA:-unknown}"

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-challenge-ml:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      WRAPT_DISABLE_EXTENSIONS: "1"
      PYTHONUNBUFFERED: "1"
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: "-1"
      ARTIFACTS_DIR: /workspace/${ARTIFACTS_DIR:-artifacts}
      DEFAULT_RUN_ID: ${DEFAULT_RUN_ID:-nmt_20260501T020331Z_uqevf5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 2
    command: >
      bash -lc "uvicorn inference_api.main:app --host 0.0.0.0 --port 8000"

  gateway:
    profiles: ["api"]
    image: nginx:latest
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api

  loki:
    profiles: ["api"]
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: ["api"]
    image: grafana/promtail:latest
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
      - nginx_logs:/var/log/nginx
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    profiles: ["api"]
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - loki

  n8n:
    profiles: ["api"]
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:8080/webhook/
      - N8N_WEBHOOK_URL=http://localhost:8080/webhook/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

  worker:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-challenge-ml:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - tfds_cache:/tfds
    environment:
      WRAPT_DISABLE_EXTENSIONS: "1"
      PYTHONUNBUFFERED: "1"
      TFDS_DATA_DIR: /tfds
      ARTIFACTS_DIR: /workspace/artifacts
      DATA_DIR: /workspace/data/processed
      API_URL: http://gateway:80
      PYTHONPATH: /workspace
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: "-1"
    command: >
      bash -lc "python -m pipeline.worker"

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-challenge-ml:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      WRAPT_DISABLE_EXTENSIONS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: "-1"
    command: >
      bash -lc "pytest -q"

volumes:
  tfds_cache:
  nginx_logs:
  n8n_data:
